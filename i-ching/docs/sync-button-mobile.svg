<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="SyncButton mobile states: muted unsynchronized vs active synchronized">
	<title>SyncButton  mobile (muted vs active)</title>
	<rect width="390" height="844" fill="#0e0d0b"/>
	<text x="24" y="56" fill="#e8e2d6" font-family="Georgia, serif" font-size="22">SyncButton · mobile</text>
	<text x="24" y="84" fill="#8a8275" font-family="system-ui, sans-serif" font-size="12">390×844 viewport · no status badge</text>

	<!-- Header mock with muted sync -->
	<rect x="24" y="120" width="342" height="200" rx="4" fill="#161411" stroke="rgba(196,165,116,0.12)"/>
	<text x="40" y="152" fill="#5c564c" font-family="system-ui, sans-serif" font-size="10" letter-spacing="1.5">UNSYNCHRONIZED</text>
	<text x="40" y="184" fill="#e8e2d6" font-family="system-ui, sans-serif" font-size="16">Muted control</text>
	<text x="40" y="208" fill="#8a8275" font-family="system-ui, sans-serif" font-size="12">Still tappable  sign-in / open popup</text>
	<circle cx="318" cy="200" r="18" fill="rgba(22,20,17,0.45)" stroke="rgba(92,86,76,0.28)" stroke-width="1"/>
	<path d="M306 198c0-4.4 3.6-8 8-8 1.2-3.5 4.5-6 8.4-6 4.9 0 8.9 4 8.9 8.9 0 .4 0 .8-.1 1.1H334c2.8 0 5 2.2 5 5s-2.2 5-5 5h-20c-2.8 0-5-2.2-5-5 0-.3 0-.6.1-.9C308.2 198.5 306.8 198.3 306 198z" fill="none" stroke="#5c564c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

	<!-- Active -->
	<rect x="24" y="348" width="342" height="200" rx="4" fill="#161411" stroke="rgba(196,165,116,0.12)"/>
	<text x="40" y="380" fill="#c4a574" font-family="system-ui, sans-serif" font-size="10" letter-spacing="1.5">SYNCHRONIZED</text>
	<text x="40" y="412" fill="#e8e2d6" font-family="system-ui, sans-serif" font-size="16">Active control</text>
	<text x="40" y="436" fill="#8a8275" font-family="system-ui, sans-serif" font-size="12">Accent border + brighter fill</text>
	<circle cx="318" cy="428" r="18" fill="rgba(196,165,116,0.14)" stroke="#c4a574" stroke-width="1"/>
	<path d="M306 426c0-4.4 3.6-8 8-8 1.2-3.5 4.5-6 8.4-6 4.9 0 8.9 4 8.9 8.9 0 .4 0 .8-.1 1.1H334c2.8 0 5 2.2 5 5s-2.2 5-5 5h-20c-2.8 0-5-2.2-5-5 0-.3 0-.6.1-.9C308.2 426.5 306.8 426.3 306 426z" fill="none" stroke="#e8e2d6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

	<!-- Syncing + error -->
	<text x="24" y="600" fill="#8a8275" font-family="system-ui, sans-serif" font-size="12">Loading / error remain distinct</text>
	<circle cx="60" cy="660" r="18" fill="rgba(196,165,116,0.08)" stroke="#8b7355" stroke-width="1"/>
	<path d="M48 658c0-4.4 3.6-8 8-8 1.2-3.5 4.5-6 8.4-6 4.9 0 8.9 4 8.9 8.9 0 .4 0 .8-.1 1.1H76c2.8 0 5 2.2 5 5s-2.2 5-5 5H56c-2.8 0-5-2.2-5-5 0-.3 0-.6.1-.9C50.2 658.5 48.8 658.3 48 658z" fill="none" stroke="#c4a574" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
	<text x="92" y="666" fill="#b9b1a3" font-family="system-ui, sans-serif" font-size="13">Syncing</text>

	<circle cx="220" cy="660" r="18" fill="rgba(201,120,90,0.14)" stroke="rgba(201,120,90,0.65)" stroke-width="1"/>
	<path d="M208 658c0-4.4 3.6-8 8-8 1.2-3.5 4.5-6 8.4-6 4.9 0 8.9 4 8.9 8.9 0 .4 0 .8-.1 1.1H236c2.8 0 5 2.2 5 5s-2.2 5-5 5h-20c-2.8 0-5-2.2-5-5 0-.3 0-.6.1-.9C210.2 658.5 208.8 658.3 208 658z" fill="none" stroke="#c9785a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
	<text x="252" y="666" fill="#b9b1a3" font-family="system-ui, sans-serif" font-size="13">Error</text>

	<text x="24" y="780" fill="#5c564c" font-family="system-ui, sans-serif" font-size="11">Open sync-button-states.html in a browser for live CSS.</text>
</svg>
